name: Feature request
description: Suggest an instrument, workflow or quality-of-life improvement.
title: "[Feature]: "
labels: ["enhancement", "needs triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Small, focused requests are easiest to evaluate. Please check existing issues first.

  - type: textarea
    id: problem
    attributes:
      label: What problem does this solve?
      description: Describe the workflow or limitation, not just the solution.
      placeholder: I want to sketch a bassline faster without switching to the piano roll.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      placeholder: Add a one-octave keyboard under the step pads that writes the held note.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Song maker / arrangement
        - Pattern editor / piano roll
        - Instruments
        - Sampler / recording
        - Projects / import / export
        - Audio playback
        - WAV export
        - Interface / accessibility
        - Build / deployment
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      placeholder: A MIDI import would also help, but it is a much larger change.
    validations:
      required: false

  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Mockups, references or examples from other tools.
    validations:
      required: false
