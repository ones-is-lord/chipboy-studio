AutoName: Chipboy Studio
Summary: 'Pocket-sized chiptune studio: sequencer, piano roll, sampler and WAV export'
Description: |
  Chipboy Studio is a complete little chiptune workstation that runs entirely
  on your device. It has a 16-step sequencer, a piano roll, 30 synth presets, a
  microphone sampler, a slicer, 16 performance pads, a riff palette and stereo
  WAV export.

  The Android app bundles the whole studio. It works offline, stores projects
  locally and sends WAV and project files to Android's share sheet. There are no
  accounts, no ads, no analytics and no network dependency.

RepoType: git
Repo: https://github.com/ones-is-lord/chipboy-studio.git

Builds:
  - versionName: 1.2.0
    versionCode: 2
    commit: v1.2.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless
      - apt-get install -y -t trixie nodejs npm
      - npm install -g pnpm@12.21.0
    init:
      - pnpm --dir .. install --frozen-lockfile
    gradle:
      - assembleRelease
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - pnpm --dir .. build
      - pnpm --dir .. exec cap sync android
    scanignore:
      - node_modules
      - dist

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.2.0
CurrentVersionCode: 2
