AutoName: Chipboy Studio
Description: |
  Chipboy Studio is a complete little chiptune workstation that runs entirely
  on your device. It has a 16-step sequencer, a piano roll, 42 synth presets,
  an 18-lane loop-station drum machine, a microphone sampler, a slicer, 16
  performance pads, a 95-riff palette, an expanded FX rack and stereo WAV
  export.

  The Android app bundles the whole studio. The core studio works offline,
  stores projects locally and sends WAV and project files to Android's share
  sheet. There are no accounts, no ads and no analytics. The only network use
  is the optional, user-initiated free-pack browser, which downloads CC0 game
  audio from credited public repositories.

RepoType: git
Repo: https://github.com/ones-is-lord/chipboy-studio.git

Builds:
  - versionName: 1.2.0
    versionCode: 2
    commit: v1.2.0
    subdir: android
    sudo:
      - apt-get update
      - apt-get install -y -t trixie openjdk-21-jdk-headless curl
      - curl -fsSLo /tmp/node.tar.gz https://nodejs.org/dist/v22.23.5/node-v22.23.5-linux-x64.tar.gz
      - echo "c54118104acc524633b5abe106bbf44a53126ec8b4e5fa105cb92b5d7de8a1a1  /tmp/node.tar.gz"
        | sha256sum -c -
      - tar -xzf /tmp/node.tar.gz --strip-components=1 -C /usr/local
      - npm install -g pnpm@12.21.0
    init: pnpm --dir .. install --frozen-lockfile
    gradle:
      - yes
    output: app/build/outputs/apk/release/app-release-unsigned.apk
    prebuild:
      - pnpm --dir .. build
      - pnpm --dir .. exec cap sync android
    scanignore:
      - node_modules

